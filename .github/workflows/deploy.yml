name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # daily, 03:00 Japan time: fetch sources, roll dates forward, redeploy
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # commit refreshed source snapshots
  issues: write # report source problems
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cut a fetch-and-commit short

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Other people's sites are fetched at most once a day: on the schedule (or a manual run), never on push.
      - name: Fetch sources
        if: github.event_name != 'push'
        run: npm run fetch
      - name: Commit refreshed snapshots
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fetched
          git diff --cached --quiet || { git commit -m "Update fetched sources" && git push; }
      - name: Open an issue for source problems
        if: hashFiles('source-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Source check $(date -u +%F)" --body-file source-report.md

      - run: npm test
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
